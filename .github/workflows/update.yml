name: Update wallet tracker

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam, chạy 1 lần/ngày
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Excel (backup)
        env:
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
        run: python update_tracker.py

      - name: Push to Google Sheets
        env:
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python push_to_gsheets.py

      - name: Commit updated Excel file
        run: |
          git config user.name "wallet-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/theo_doi_vi.xlsx
          git diff --quiet --cached || git commit -m "Auto update wallet tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
