name: Update wallet tracker

on:
  schedule:
    # Chạy lúc 00:00 và 12:00 UTC = 07:00 và 19:00 giờ Việt Nam
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" chạy tay trên GitHub khi cần

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker update
        env:
          TONAPI_KEY: ${{ secrets.TONAPI_KEY }}
        run: python update_tracker.py

      - name: Commit updated file
        run: |
          git config user.name "wallet-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/theo_doi_vi.xlsx
          git diff --quiet --cached || git commit -m "Auto update wallet tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
